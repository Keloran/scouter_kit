# g1v0: as g1min, plus g1_retained (top 8 KiB of app RAM, above MCUboot's RAM use, kept over resets).
# G1 app-core partition map (reconstructed): MCUboot 48 KiB at 0x0, primary slot
# 0xC000..0xFC000, settings 0xFC000/0xFE000, secondary slots on the QSPI NOR at
# 0x0 (app, 0xF0000) and 0xF0000 (net, 0x40000), stock's settings and factory record at 0x130000 (read
# only), the asset store g1_assets from 0x140000 to the end of the 24-bit space; the upper 16 MiB is out of
# reach of 24-bit addressing and unused.
mcuboot:
  address: 0x0
  size: 0xc000
  region: flash_primary
mcuboot_pad:
  address: 0xc000
  size: 0x200
  region: flash_primary
app:
  address: 0xc200
  size: 0xefe00
  region: flash_primary
mcuboot_primary:
  orig_span: &id001
  - mcuboot_pad
  - app
  span: *id001
  address: 0xc000
  size: 0xf0000
  region: flash_primary
mcuboot_primary_app:
  orig_span: &id002
  - app
  span: *id002
  address: 0xc200
  size: 0xefe00
  region: flash_primary
settings_storage:
  address: 0xfc000
  size: 0x2000
  region: flash_primary
g1_storage2:
  address: 0xfe000
  size: 0x2000
  region: flash_primary
mcuboot_primary_1:
  address: 0x0
  size: 0x40000
  device: flash_ctrl
  region: ram_flash
mcuboot_secondary:
  address: 0x0
  size: 0xf0000
  device: MX25R64
  region: external_flash
mcuboot_secondary_1:
  address: 0xf0000
  size: 0x40000
  device: MX25R64
  region: external_flash
stock_settings:
  address: 0x130000
  size: 0x10000
  device: MX25R64
  region: external_flash
g1_assets:
  address: 0x140000
  size: 0xec0000
  device: MX25R64
  region: external_flash
external_flash:
  address: 0x1000000
  size: 0x1000000
  device: MX25R64
  region: external_flash
rpmsg_nrf53_sram:
  address: 0x20070000
  size: 0x10000
  region: sram_primary
g1_retained:
  address: 0x2006e000
  size: 0x2000
  region: sram_primary
pcd_sram:
  address: 0x20000000
  size: 0x2000
  region: sram_primary
