# DK variant of pm_static.yml: identical layout, external flash region ends at 8 MiB.
# G1 app-core partition map (reconstructed): MCUboot 48 KiB at 0x0, primary slot
# 0xC000..0xFC000, settings 0xFC000/0xFE000, secondary slots on the QSPI NOR at
# 0x0 (app, 0xF0000) and 0xF0000 (net, 0x40000), app data from 0x130000.
mcuboot:
  address: 0x0
  size: 0xc000
  region: flash_primary
mcuboot_pad:
  address: 0xc000
  size: 0x200
  region: flash_primary
app:
  address: 0xc200
  size: 0xefe00
  region: flash_primary
mcuboot_primary:
  orig_span: &id001
  - mcuboot_pad
  - app
  span: *id001
  address: 0xc000
  size: 0xf0000
  region: flash_primary
mcuboot_primary_app:
  orig_span: &id002
  - app
  span: *id002
  address: 0xc200
  size: 0xefe00
  region: flash_primary
settings_storage:
  address: 0xfc000
  size: 0x2000
  region: flash_primary
g1_storage2:
  address: 0xfe000
  size: 0x2000
  region: flash_primary
mcuboot_primary_1:
  address: 0x0
  size: 0x40000
  device: flash_ctrl
  region: ram_flash
mcuboot_secondary:
  address: 0x0
  size: 0xf0000
  device: MX25R64
  region: external_flash
mcuboot_secondary_1:
  address: 0xf0000
  size: 0x40000
  device: MX25R64
  region: external_flash
external_flash:
  address: 0x130000
  size: 0x6d0000
  device: MX25R64
  region: external_flash
pcd_sram:
  address: 0x20000000
  size: 0x2000
  region: sram_primary
