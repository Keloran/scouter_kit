# dk_hci app core: the nRF5340 DK as a Bluetooth controller for the PC. Zephyr's hci_uart relays H:4
# between UART0 (J-Link VCOM, 1 Mbaud, RTS/CTS; app.overlay) and the net core's hci_rpmsg + SoftDevice
# Controller (child_image/hci_rpmsg.conf). Buffers here must cover what the controller reports: an H:4
# packet that finds no buffer is lost.
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_MAX_CONN=4
CONFIG_BT_TINYCRYPT_ECC=n
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_CMD_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_COUNT=16
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Errors and warnings over J-Link RTT (UART0 carries the HCI traffic).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
